<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>个人获奖证书展示</title>
    <style>
        *{box-sizing:border-box;margin:0;padding:0}
        body{background:#f5f5f5;font-family:system-ui,sans-serif;padding:20px}
        h1{text-align:center;margin-bottom:30px;color:#222;font-size:22px}
        .tip{text-align:center;color:#666;margin-bottom:24px;font-size:14px}
        .container{max-width:900px;margin:0 auto;display:grid;gap:30px}
        .card{background:#fff;padding:16px;border-radius:12px;box-shadow:0 2px 8px #00000015}
        .card img{width:100%;height:auto;border-radius:6px;display:block}
        .card p{text-align:center;margin-top:12px;color:#333;font-weight:500}
    </style>
</head>
<body>
    <h1>🏆 学科竞赛获奖证书</h1>
    <p class="tip">注：图片已隐去队友姓名，保护团队成员隐私</p>
    <div class="container">
        <div class="card">
            <img src="img/挑战杯.jpg" alt="挑战杯证书">
            <p>挑战杯</p>
        </div>
        <div class="card">
            <img src="img/第六届中国高校智能机器人创意大赛.jpg" alt="第六届中国高校智能机器人创意大赛">
            <p>第六届中国高校智能机器人创意大赛</p>
        </div>
        <div class="card">
            <img src="img/第五届郑州师范学院创新创业大赛.jpg" alt="第五届郑州师范学院创新创业大赛">
            <p>第五届郑州师范学院创新创业大赛</p>
        </div>
        <div class="card">
            <img src="img/高校电气电子工程创新大赛.jpg" alt="高校电气电子工程创新大赛">
            <p>第五届高校电气电子工程创新大赛</p>
        </div>
        <div class="card">
            <img src="img/河南省大学生机器人竞赛.jpg" alt="河南省大学生机器人竞赛">
            <p>河南省大学生机器人竞赛</p>
        </div>
    </div>
</body>
</html>
